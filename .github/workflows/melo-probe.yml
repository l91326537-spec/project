# 시험용: MeloTTS 한국어 음성 품질 확인(병합하지 않음)
name: MeloTTS 시험
on:
  push:
    branches: [ci/voices-open]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 설치
        run: |
          pip install -q git+https://github.com/myshell-ai/MeloTTS.git faster-whisper lameenc 2>&1 | tail -5
          python -m unidic download 2>&1 | tail -2
      - name: 기준 음성 꺼내기
        run: |
          git fetch -q origin ci/voices
          mkdir -p probe/ref
          for f in $(echo '{"쌀": "voice/c6151bde32e2.mp3", "살": "voice/9b0d1a0236be.mp3", "달": "voice/cce1c61af291.mp3", "발": "voice/21fedcb9225d.mp3", "불": "voice/f2f3a9ab09fd.mp3", "풀": "voice/d1c1c05957bd.mp3", "뿔": "voice/1309d938ab9a.mp3", "물": "voice/0dc78427bebc.mp3", "감": "voice/e2eea059d1b9.mp3", "김": "voice/f2dc74a3406d.mp3", "곰": "voice/878958184cec.mp3", "토끼": "voice/cd8cc6fc9e84.mp3", "도끼": "voice/f476244a4057.mp3"}' | python -c "import json,sys;print(' '.join(json.load(sys.stdin).values()))"); do git show de3a7b3:web/$f > probe/ref/$(basename $f); done
          ls probe/ref | wc -l
      - name: 만들고 받아 적기
        id: run
        continue-on-error: true
        run: python probe/melo_probe.py '{"쌀": "voice/c6151bde32e2.mp3", "살": "voice/9b0d1a0236be.mp3", "달": "voice/cce1c61af291.mp3", "발": "voice/21fedcb9225d.mp3", "불": "voice/f2f3a9ab09fd.mp3", "풀": "voice/d1c1c05957bd.mp3", "뿔": "voice/1309d938ab9a.mp3", "물": "voice/0dc78427bebc.mp3", "감": "voice/e2eea059d1b9.mp3", "김": "voice/f2dc74a3406d.mp3", "곰": "voice/878958184cec.mp3", "토끼": "voice/cd8cc6fc9e84.mp3", "도끼": "voice/f476244a4057.mp3"}' 2>&1 | tee probe/out-log.txt
      - name: 결과 올리기
        if: always()
        run: |
          mkdir -p probe/out; cp probe/out-log.txt probe/out/ 2>/dev/null || true
          pip list 2>/dev/null | grep -iE "torch|transformers|melo|whisper" > probe/out/pip.txt || true
          git add -f probe/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "MeloTTS 시험 결과" && git push origin HEAD:ci/voices-open || true
