# 문항(web/content.js)을 고친 PR에서 AI 음성 파일을 만들어 그 PR 브랜치에 올린다.
# Azure 음성 서비스(공식 API)를 쓴다. 키는 저장소 Secrets의 AZURE_SPEECH_KEY, AZURE_SPEECH_REGION. 이미 있는 파일은 건너뛴다.
name: 음성 파일 만들기

on:
  pull_request:
    paths: ['web/content.js', 'tools/make_voices.py', '.github/workflows/voices.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: voices-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false # 처음 만들 때는 30분쯤 걸리므로 도중에 끊지 않는다

jobs:
  voices:
    # 다른 사람 저장소에서 온 PR에는 올릴 권한이 없다
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - id: gen
        continue-on-error: true # 일부가 실패해도 만든 파일은 올린다
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 tools/make_voices.py
      - name: 바뀐 음성 파일 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add web/voice
          if git diff --cached --quiet; then echo "바뀐 음성 파일 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AI 음성 파일 갱신"
          git pull -q --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          # 봇이 올린 커밋은 배포를 다시 돌리지 않으므로 main이면 직접 배포한다
          if [ "$BRANCH" = main ]; then gh workflow run pages.yml --ref main; fi
      - if: steps.gen.outcome == 'failure'
        run: echo "만들지 못한 음성이 있어요. 위 로그를 확인하세요. 키가 없다면 저장소 Secrets에 AZURE_SPEECH_KEY, AZURE_SPEECH_REGION을 넣어 주세요." && exit 1
