# 문항(web/content.js)을 고친 PR에서 AI 음성 파일을 만들어 그 PR 브랜치에 올린다. 이미 있는 파일은 건너뛴다.
# 기본은 오픈소스 MeloTTS(키 필요 없음)로 만들고 Whisper로 들어 확인한다.
# 저장소 Secrets에 AZURE_SPEECH_KEY, AZURE_SPEECH_REGION을 넣으면 Azure 음성 서비스로 만든다.
name: 음성 파일 만들기

on:
  pull_request:
    paths: ['web/content.js', 'tools/make_voices.py', '.github/workflows/voices.yml']
  workflow_dispatch:
    inputs:
      limit:
        description: '시험 삼아 새 문항 중 앞의 몇 개만 만들기(0이면 전부)'
        default: '0'
      redo_weak:
        description: '확인에서 애매했던 음성도 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: voices-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false # 처음 만들 때는 오래 걸리므로 도중에 끊지 않는다

jobs:
  voices:
    # 다른 사람 저장소에서 온 PR에는 올릴 권한이 없다
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-python@v5
        if: env.AZURE_SPEECH_KEY == ''
        with:
          python-version: '3.10'
      - name: MeloTTS 설치
        if: env.AZURE_SPEECH_KEY == ''
        run: |
          pip install -q git+https://github.com/myshell-ai/MeloTTS.git faster-whisper lameenc
          python -m unidic download
      - id: gen
        continue-on-error: true # 일부가 실패해도 만든 파일은 올린다
        run: |
          set -o pipefail  # tee를 거쳐도 실패를 놓치지 않게
          python3 tools/make_voices.py --limit "${{ inputs.limit || 0 }}" ${{ inputs.redo_weak && '--redo-weak' || '' }} 2>&1 | tee /tmp/voices.log
      - name: 바뀐 음성 파일 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d web/voice ] && git add -A web/voice
          [ -f tools/voice_qa.json ] && git add tools/voice_qa.json
          # 실패했을 때는 이유를 브랜치에서 볼 수 있게 기록도 함께 올린다(성공하면 올리지 않는다)
          if [ "${{ steps.gen.outcome }}" = failure ]; then tail -c 60000 /tmp/voices.log > tools/voice_log.txt; git add tools/voice_log.txt; fi
          if git diff --cached --quiet; then echo "바뀐 음성 파일 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AI 음성 파일 갱신"
          git pull -q --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          # 봇이 올린 커밋은 배포를 다시 돌리지 않으므로 main이면 직접 배포한다
          if [ "$BRANCH" = main ]; then gh workflow run pages.yml --ref main; fi
      - if: always() && steps.gen.outcome == 'failure'
        run: echo "만들지 못한 음성이 있어요. 위 로그를 확인하세요." && exit 1
